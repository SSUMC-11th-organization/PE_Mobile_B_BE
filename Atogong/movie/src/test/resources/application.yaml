# 테스트 전용 설정. 테스트를 돌릴 때는 src/main/resources/application.yaml 대신 이 값들이 쓰임
spring:
  datasource:
    # MODE=MySQL: H2에게 MySQL인 척 해달라고 부탁하는 옵션
    url: jdbc:h2:mem:umc_movie;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 테스트마다 메모리 DB의 스키마를 새로 만들어 엔티티 매핑도 함께 검증
      ddl-auto: create-drop
    open-in-view: false

# 이 값이 없으면 서버를 띄우는 단계에서 JwtUtil이 값을 찾지 못해 테스트가 시작도 못 함
jwt:
  secret: test-secret-for-context-loading-only
  access-expiration: 3600
